<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publication Multimédia</title>
    <style>
        body {
            background: #000; color: white; font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; overflow: hidden;
        }

        /* Animation de chargement */
        .loader {
            border: 4px solid #333; border-top: 4px solid #25d366;
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }

        /* Barre de progression */
        .progress-container {
            width: 80%; background-color: #333; border-radius: 10px; height: 12px;
            display: none; margin-top: 15px; border: 1px solid #444;
        }

        .progress-bar {
            width: 0%; height: 100%; background-color: #25d366;
            border-radius: 10px; transition: width 0.3s;
        }

        #status-text { font-size: 16px; margin-top: 10px; color: #25d366; text-align: center; font-weight: bold; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #file-input { display: none; }

        .btn-select {
            background: #25d366; color: white; border: none;
            padding: 12px 25px; border-radius: 30px; font-weight: bold;
            cursor: pointer; font-size: 16px; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }
    </style>
</head>
<body>

    <div class="loader" id="main-loader"></div>
    <div id="status-text">Prêt pour la publication</div>

    <div class="progress-container" id="p-container">
        <div class="progress-bar" id="p-bar"></div>
    </div>

    <button class="btn-select" id="btn-trigger" onclick="document.getElementById('file-input').click()">
        Choisir Photo / Vidéo / Audio
    </button>

    <form id="status-form">
        {% csrf_token %}
        <input type="file" name="image" id="file-input" accept="image/*,video/*,audio/*">
    </form>

    <script>
        const fileInput = document.getElementById('file-input');
        const pBar = document.getElementById('p-bar');
        const pContainer = document.getElementById('p-container');
        const statusText = document.getElementById('status-text');
        const btnTrigger = document.getElementById('btn-trigger');

        // Ouvre automatiquement la galerie au chargement
        window.onload = () => {
            setTimeout(() => { fileInput.click(); }, 300);
        };

        fileInput.onchange = () => {
            if (fileInput.files.length > 0) {
                btnTrigger.style.display = 'none';
                uploadFile(fileInput.files[0]);
            }
        };

        function uploadFile(file) {
            const formData = new FormData();
            formData.append('image', file); // On garde le nom 'image' car c'est celui du modèle
            formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

            const xhr = new XMLHttpRequest();
            pContainer.style.display = 'block';

            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    pBar.style.width = percent + '%';
                    statusText.innerText = "Chargement : " + percent + "%";
                }
            });

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        statusText.innerText = "Publication réussie !";
                        setTimeout(() => {
                            window.location.href = "{% url 'status_list' %}";
                        }, 800);
                    } else {
                        statusText.innerText = "Erreur. Fichier peut-être trop lourd.";
                        btnTrigger.style.display = 'block';
                    }
                }
            };

            xhr.open('POST', "{% url 'add_status' %}", true);
            xhr.send(formData);
        }
    </script>
</body>
</html>
