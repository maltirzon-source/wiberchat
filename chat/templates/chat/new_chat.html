<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle discussion - Wiberchat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-teal: #065e52;
            --text-main: #111b21;
            --text-secondary: #667781;
            --white: #ffffff;
            --bg-light: #f0f2f5;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background-color: var(--bg-light);
        }
        header {
            background-color: var(--primary-teal);
            color: white;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header a { color: white; text-decoration: none; font-size: 20px; }
        header .title { font-size: 19px; font-weight: 600; }
        .search-box {
            padding: 10px 16px;
            background: white;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 56px;
            z-index: 9;
        }
        .search-input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 15px;
        }
        .chat-list { background: white; min-height: calc(100vh - 110px); }
        .chat-item {
            display: flex;
            padding: 12px 16px;
            align-items: center;
            text-decoration: none;
            color: inherit;
            border-bottom: 0.5px solid #f2f2f2;
        }
        .chat-item:active { background: #f5f5f5; }
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 15px;
            object-fit: cover;
            background: #eee;
            flex-shrink: 0;
        }
        .user-info { flex: 1; min-width: 0; }
        .name { font-size: 16px; font-weight: 700; color: var(--text-main); }
        .email { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
        .empty {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }
        .empty i { font-size: 5rem; opacity: 0.2; margin-bottom: 20px; }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'chat_list' %}">←</a>
        <div class="title">Nouvelle discussion</div>
    </header>

    <div class="search-box">
        <input type="text" class="search-input" placeholder="Rechercher un contact..." id="searchInput">
    </div>

    <div class="chat-list" id="userList">
        {% for user_item in users %}
        <a href="{% url 'chat_room' user_item.username %}" class="chat-item user-row">
            <img src="{% if user_item.profile.image %}{{ user_item.profile.image.url }}{% else %}https://ui-avatars.com/api/?name={{ user_item.username }}&background=065e52&color=fff{% endif %}" class="avatar">
            <div class="user-info">
                <div class="name">{{ user_item.username }}</div>
                <div class="email">{{ user_item.email|default:"Appuyez pour discuter" }}</div>
            </div>
        </a>
        {% empty %}
        <div class="empty">
            <i class="fas fa-users"></i>
            <p><b>Aucun nouveau contact</b></p>
            <p style="font-size:14px">Tous les utilisateurs sont déjà dans tes discussions</p>
        </div>
        {% endfor %}
    </div>

    <script>
        document.getElementById('searchInput').addEventListener('keyup', function() {
            let filter = this.value.toLowerCase();
            document.querySelectorAll('.user-row').forEach(row => {
                let name = row.querySelector('.name').textContent.toLowerCase();
                row.style.display = name.includes(filter) ? 'flex' : 'none';
            });
        });
    </script>
</body>
</html>
